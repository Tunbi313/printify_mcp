<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sunfade Printify{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      background: #fafafa;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eaeaea; }
      input, select, textarea { background: #1e1e1e !important; color: #eaeaea !important; border-color: #444 !important; }
      .card { background: #1a1a1a !important; border-color: #333 !important; }
    }
    h1 { font-size: 1.4rem; }
    a { color: inherit; }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin: 14px 0 4px; font-size: 0.9rem; }
    input[type=text], input[type=file], select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .btn-primary { background: #2563eb; color: #fff; margin-top: 16px; }
    .btn-publish { background: #16a34a; color: #fff; }
    .btn-delete { background: #dc2626; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #111; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
    .msg-success { background: #dcfce7; color: #166534; }
    .msg-error { background: #fee2e2; color: #991b1b; }
    .tpl-meta { font-size: 0.85rem; color: #666; margin-top: 4px; }
    .images { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
    .images img { width: 220px; border-radius: 8px; border: 1px solid #ddd; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; background: #eef2ff; color: #3730a3; }
    #desc-rendered table, .product-description table { border-collapse: collapse; margin: 8px 0; }
    #desc-rendered td, #desc-rendered th, .product-description td, .product-description th {
      border: 1px solid #ddd; padding: 6px 12px; text-align: left;
    }
    #desc-rendered ul, .product-description ul { margin: 6px 0; padding-left: 22px; }
    #desc-rendered p, .product-description p { margin: 8px 0; }
    #desc-rendered:focus { outline: 2px solid #2563eb; outline-offset: -1px; }
    @media (prefers-color-scheme: dark) {
      #desc-rendered { background: #1e1e1e; color: #eaeaea; border-color: #444; }
      #desc-rendered table, .product-description table { border-color: #444; }
      #desc-rendered td, #desc-rendered th, .product-description td, .product-description th { border-color: #444; }
    }
    nav { margin-bottom: 8px; }
    nav a { margin-right: 16px; font-size: 0.9rem; font-weight: 600; }
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center;
      padding: 24px;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 10px; padding: 20px;
      max-width: 700px; max-height: 85vh; overflow-y: auto; width: 100%;
    }
    @media (prefers-color-scheme: dark) { .modal-box { background: #1a1a1a; } }
    .modal-box h3 { margin-top: 0; }
    .modal-close { float: right; background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
    .modal-images img { width: 100%; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd; }
    .modal-status { font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <h1><a href="{% url 'index' %}" style="text-decoration:none;">🖨️ Sunfade Printify</a></h1>
  <nav>
    <a href="{% url 'index' %}">Tạo sản phẩm</a>
    <a href="{% url 'batch_page' %}">Tạo hàng loạt</a>
    <a href="{% url 'library_page' %}">Thư viện</a>
    <a href="{% url 'mockup_studio_index' %}">Mockup Studio</a>
    <a href="{% url 'template_gallery' %}">Danh sách Template</a>
    <a href="{% url 'upscale_page' %}">Upscale ảnh</a>
  </nav>

  {% if messages %}
    {% for message in messages %}
      <div class="msg {% if message.tags == 'error' %}msg-error{% else %}msg-success{% endif %}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
